services:
  web:
    build: .
    command: npx tsx src/web/index.ts
    ports:
      - "${PORT:-3001}:3001"
    env_file: .env
    volumes:
      - assets:/app/assets

  worker:
    build: .
    command: npx tsx src/worker/index.ts
    env_file: .env
    volumes:
      - assets:/app/assets

volumes:
  assets:
