<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 628px;
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e293b 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #f1f5f9; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 48px 80px; text-align: center;
  }
  .quote-mark { font-size: 72px; color: #6366f1; opacity: 0.5; line-height: 1; margin-bottom: 8px; }
  .text { font-size: 30px; line-height: 1.6; color: #e2e8f0; font-weight: 500; max-width: 900px; }
  .category { font-size: 16px; color: #a5b4fc; text-transform: uppercase; letter-spacing: 2px; margin-top: 32px; }
  .footer { margin-top: auto; font-size: 14px; color: #475569; }
</style></head>
<body>
  <div class="quote-mark">&ldquo;</div>
  <div class="text">{{generatedText}}</div>
  <div class="category">{{category}}</div>
  <div class="footer">{{date}}</div>
</body>
</html>
