<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 628px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #f1f5f9; display: flex; flex-direction: column;
    justify-content: center; padding: 48px 64px;
  }
  .category { font-size: 18px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
  .stat-row { display: flex; gap: 40px; margin-bottom: 24px; }
  .stat { display: flex; flex-direction: column; }
  .stat-value { font-size: 48px; font-weight: 700; color: #3b82f6; }
  .stat-label { font-size: 16px; color: #94a3b8; margin-top: 4px; }
  .text { font-size: 22px; line-height: 1.5; color: #cbd5e1; max-width: 90%; }
  .footer { margin-top: auto; font-size: 14px; color: #475569; }
</style></head>
<body>
  <div class="category">{{category}}</div>
  <div class="text">{{generatedText}}</div>
  <div class="footer">{{date}}</div>
</body>
</html>
